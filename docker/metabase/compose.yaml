services:
  metabase-db:
    image: postgres:16
    container_name: dragons-services-metabase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MB_DB_USER:-dragons}
      POSTGRES_PASSWORD: ${MB_DB_PASS:-dragons_dev_password}
      POSTGRES_DB: ${MB_DB_DBNAME:-metabase}
    volumes:
      - metabase_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      dragons-services-docker-network:
        aliases:
          - dragons-metabase-db

  metabase:
    image: metabase/metabase:latest
    container_name: dragons-services-metabase
    restart: unless-stopped
    ports:
      - "50040:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${MB_DB_DBNAME:-metabase}
      MB_DB_PORT: 5432
      MB_DB_USER: ${MB_DB_USER:-dragons}
      MB_DB_PASS: ${MB_DB_PASS:-dragons_dev_password}
      MB_DB_HOST: metabase-db
    depends_on:
      metabase-db:
        condition: service_healthy
    networks:
      dragons-services-docker-network:
        aliases:
          - dragons-metabase

volumes:
  metabase_pgdata:

networks:
  dragons-services-docker-network:
    name: dragons-services-docker-network
    external: true
